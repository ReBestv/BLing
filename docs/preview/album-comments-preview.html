<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StandBy Us · 相册评论预览</title>
  <style>
    :root {
      --canvas: #efe9e4;
      --surface: #fffaf7;
      --ink: #302724;
      --muted: #8f7e77;
      --line: #eee3dd;
      --accent: #ee8f7e;
      --accent-deep: #d96d5a;
      --sheet: #fffdfb;
      --shadow: 0 28px 70px rgb(75 49 39 / 24%);
    }

    * { box-sizing: border-box; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 16%, rgb(255 255 255 / 68%), transparent 26rem),
        linear-gradient(140deg, #e5d4cb 0%, var(--canvas) 52%, #dcd4d0 100%);
    }

    .phone {
      width: min(100vw, 430px);
      height: min(100dvh, 900px);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #161312;
      box-shadow: var(--shadow);
    }

    .story-image {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgb(0 0 0 / 36%) 0%, transparent 24%, transparent 60%, rgb(0 0 0 / 66%) 100%),
        url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85");
      background-position: center;
      background-size: cover;
      transform: scale(1.015);
    }

    .safe-top {
      height: 48px;
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 24px 10px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .viewer-header {
      position: absolute;
      z-index: 2;
      top: 56px;
      right: 18px;
      left: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-button {
      width: 48px;
      height: 48px;
      display: inline-grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: white;
      background: rgb(18 14 12 / 42%);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .icon-button:active { transform: scale(.96); }
    .icon-button svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }

    .viewer-meta {
      position: absolute;
      z-index: 2;
      right: 24px;
      bottom: 30px;
      left: 24px;
      color: white;
      text-align: center;
    }

    .viewer-meta h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.4;
      font-weight: 650;
      text-shadow: 0 1px 9px rgb(0 0 0 / 28%);
    }

    .viewer-meta p {
      margin: 7px 0 0;
      color: rgb(255 255 255 / 80%);
      font-size: 13px;
    }

    .comment-trigger {
      position: absolute;
      z-index: 4;
      right: 18px;
      bottom: 108px;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 24px;
      color: white;
      background: rgb(30 24 22 / 58%);
      box-shadow: 0 8px 18px rgb(0 0 0 / 18%);
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .comment-trigger svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2; fill: none; }
    .comment-trigger strong { font-size: 14px; font-weight: 650; }
    .comment-trigger:active { transform: scale(.98); }

    .scrim {
      position: absolute;
      z-index: 5;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      background: rgb(0 0 0 / 24%);
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .comments-sheet {
      position: absolute;
      z-index: 6;
      right: 0;
      bottom: 0;
      left: 0;
      height: min(67%, 600px);
      display: flex;
      flex-direction: column;
      border-radius: 28px 28px 0 0;
      background: var(--sheet);
      box-shadow: 0 -12px 36px rgb(51 32 25 / 18%);
      transform: translateY(calc(100% - 82px));
      transition: transform 280ms cubic-bezier(.2, .8, .2, 1);
    }

    .phone.comments-open .comments-sheet { transform: translateY(0); }
    .phone.comments-open .scrim { opacity: 1; visibility: visible; }

    .sheet-header {
      min-height: 82px;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .handle {
      position: absolute;
      top: 10px;
      left: calc(50% - 18px);
      width: 36px;
      height: 4px;
      border-radius: 4px;
      background: #d9ccc5;
    }

    .sheet-title { text-align: center; font-size: 16px; font-weight: 700; }
    .sheet-count { color: var(--muted); font-size: 13px; font-weight: 500; }
    .close-sheet { color: #826f68; background: transparent; }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 7px 20px 16px;
      scrollbar-width: none;
    }
    .comments-list::-webkit-scrollbar { display: none; }

    .comment {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      padding: 16px 0;
    }

    .comment + .comment { border-top: 1px solid #f3ebe7; }

    .avatar {
      width: 40px;
      height: 40px;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgb(73 45 36 / 14%);
    }
    .avatar--partner { background: linear-gradient(135deg, #66534f, #b17c6f); }
    .avatar--mine { background: linear-gradient(135deg, #ed9c8d, #d96d5a); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .comment-main { min-width: 0; }
    .comment-name { color: #684f48; font-size: 13px; font-weight: 700; }
    .comment-text { margin: 4px 0 0; color: #302724; font-size: 15px; line-height: 1.55; word-break: break-word; }
    .comment-time { margin-top: 5px; color: #aa9991; font-size: 12px; }
    .comment--mine { cursor: pointer; }
    .comment--mine:active .comment-text { color: var(--accent-deep); }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgb(255 253 251 / 94%);
      backdrop-filter: blur(14px);
    }

    .composer .avatar { width: 36px; height: 36px; flex: 0 0 auto; font-size: 13px; }
    .comment-input {
      min-width: 0;
      flex: 1;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #e8dcd6;
      border-radius: 14px;
      outline: none;
      color: var(--ink);
      background: #faf6f4;
      font-size: 15px;
    }
    .comment-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgb(238 143 126 / 12%); }
    .comment-input::placeholder { color: #b6a59e; }
    .send {
      height: 44px;
      min-width: 56px;
      padding: 0 12px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: var(--accent);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .send:disabled { cursor: default; opacity: .4; }
    .send:not(:disabled):active { transform: scale(.96); }

    .delete-menu {
      position: absolute;
      z-index: 8;
      right: 20px;
      bottom: 88px;
      width: 146px;
      padding: 8px;
      border: 1px solid #f0e4de;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 32px rgb(62 37 29 / 18%);
    }
    .delete-menu[hidden] { display: none; }
    .delete-menu button { width: 100%; padding: 11px; border: 0; border-radius: 10px; color: #c55245; background: #fff5f3; font-size: 14px; cursor: pointer; }

    .toast {
      position: absolute;
      z-index: 10;
      top: 64px;
      left: 50%;
      padding: 10px 14px;
      border-radius: 18px;
      color: white;
      background: rgb(43 35 31 / 88%);
      font-size: 13px;
      transform: translate(-50%, -18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.visible { transform: translate(-50%, 0); opacity: 1; }

    @media (min-width: 431px) {
      .phone { border: 8px solid #25201e; border-radius: 44px; height: 844px; }
      .safe-top { padding-left: 26px; padding-right: 26px; }
    }
  </style>
</head>
<body>
  <main class="phone comments-open" id="phone" aria-label="StandBy Us 相册评论预览">
    <div class="story-image" aria-hidden="true"></div>
    <div class="safe-top"><span>9:41</span><span>● ● ●</span></div>

    <header class="viewer-header">
      <button class="icon-button" aria-label="返回相册">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg>
      </button>
      <button class="icon-button" aria-label="更多操作">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></svg>
      </button>
    </header>

    <button class="comment-trigger" id="commentTrigger" aria-label="打开评论，当前有三条">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.48 8.4 8.4 0 0 1-3.14-.69L4 20l1.36-4.1A7.44 7.44 0 0 1 4 11.5 8 8 0 0 1 12 4a8 8 0 0 1 8 7.5Z"/></svg>
      <strong>评论 <span id="triggerCount">3</span></strong>
    </button>

    <section class="viewer-meta" aria-label="照片信息">
      <h1>把八月的傍晚，留给我们</h1>
      <p>今天 18:42</p>
    </section>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <section class="comments-sheet" id="commentsSheet" aria-label="照片评论">
      <div class="handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <span></span>
        <div class="sheet-title">评论 <span class="sheet-count" id="sheetCount">3</span></div>
        <button class="icon-button close-sheet" id="closeSheet" aria-label="收起评论">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </header>

      <div class="comments-list" id="commentsList" aria-live="polite">
        <article class="comment">
          <div class="avatar avatar--partner" aria-label="阿梨的头像"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80" alt=""></div>
          <div class="comment-main">
            <div class="comment-name">阿梨</div>
            <p class="comment-text">怎么把光拍得这么温柔。</p>
            <div class="comment-time">2 分钟前</div>
          </div>
        </article>
        <article class="comment comment--mine" data-removable="true" title="点击管理自己的评论" tabindex="0" role="button" aria-label="我的评论：因为身边是你，点击管理">
          <div class="avatar avatar--mine" aria-label="周周的头像">周</div>
          <div class="comment-main">
            <div class="comment-name">周周</div>
            <p class="comment-text">因为身边是你。</p>
            <div class="comment-time">刚刚</div>
          </div>
        </article>
        <article class="comment">
          <div class="avatar avatar--partner" aria-label="阿梨的头像"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80" alt=""></div>
          <div class="comment-main">
            <div class="comment-name">阿梨</div>
            <p class="comment-text">那下次还要一起看日落。</p>
            <div class="comment-time">刚刚</div>
          </div>
        </article>
      </div>

      <form class="composer" id="commentForm">
        <div class="avatar avatar--mine" aria-label="周周的头像">周</div>
        <input class="comment-input" id="commentInput" maxlength="100" autocomplete="off" placeholder="说点什么…" aria-label="输入评论，最多 100 字">
        <button class="send" id="sendButton" type="submit" disabled>发送</button>
      </form>
      <aside class="delete-menu" id="deleteMenu" hidden><button id="deleteButton" type="button">删除这条评论</button></aside>
    </section>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <script>
    const phone = document.getElementById('phone');
    const input = document.getElementById('commentInput');
    const sendButton = document.getElementById('sendButton');
    const form = document.getElementById('commentForm');
    const list = document.getElementById('commentsList');
    const deleteMenu = document.getElementById('deleteMenu');
    let count = 3;
    let selectedComment = null;

    function setSheet(open) {
      phone.classList.toggle('comments-open', open);
      deleteMenu.hidden = true;
      if (open) setTimeout(() => input.focus(), 260);
    }

    function updateCount(change) {
      count += change;
      document.getElementById('triggerCount').textContent = count;
      document.getElementById('sheetCount').textContent = count;
      document.getElementById('commentTrigger').setAttribute('aria-label', `打开评论，当前有 ${count} 条`);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 1800);
    }

    document.getElementById('commentTrigger').addEventListener('click', () => setSheet(true));
    document.getElementById('closeSheet').addEventListener('click', () => setSheet(false));
    document.getElementById('scrim').addEventListener('click', () => setSheet(false));

    input.addEventListener('input', () => {
      sendButton.disabled = !input.value.trim();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const article = document.createElement('article');
      article.className = 'comment comment--mine';
      article.dataset.removable = 'true';
      article.tabIndex = 0;
      article.setAttribute('role', 'button');
      article.setAttribute('aria-label', `我的评论：${text}，点击管理`);
      article.innerHTML = `
        <div class="avatar avatar--mine" aria-label="周周的头像">周</div>
        <div class="comment-main">
          <div class="comment-name">周周</div>
          <p class="comment-text"></p>
          <div class="comment-time">刚刚</div>
        </div>`;
      article.querySelector('.comment-text').textContent = text;
      list.append(article);
      list.scrollTop = list.scrollHeight;
      input.value = '';
      sendButton.disabled = true;
      updateCount(1);
      showToast('评论已发送');
    });

    list.addEventListener('click', (event) => {
      const comment = event.target.closest('[data-removable]');
      if (!comment) return;
      selectedComment = comment;
      deleteMenu.hidden = false;
    });

    list.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const comment = event.target.closest('[data-removable]');
      if (!comment) return;
      event.preventDefault();
      selectedComment = comment;
      deleteMenu.hidden = false;
    });

    document.getElementById('deleteButton').addEventListener('click', () => {
      if (confirm('删除这条评论？')) {
        selectedComment?.remove();
        selectedComment = null;
        deleteMenu.hidden = true;
        updateCount(-1);
        showToast('评论已删除');
      }
    });
  </script>
</body>
</html>
