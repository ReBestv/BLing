<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StandBy Us - 首页融合感预览</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #201c1b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #5a4a42;
  }

  .phone {
    width: 390px;
    height: 844px;
    overflow: hidden;
    position: relative;
    border-radius: 44px;
    background:
      radial-gradient(circle at 18% 9%, rgba(255, 215, 200, 0.76), transparent 28%),
      linear-gradient(180deg, #fff8f5 0%, #fff6f0 54%, #fffaf6 100%);
    box-shadow: 0 24px 72px rgba(0, 0, 0, 0.38);
    border: 1px solid rgba(255, 255, 255, 0.22);
  }

  .status-bar {
    height: 44px;
    padding: 13px 28px 0;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: rgba(90, 74, 66, 0.78);
  }

  .header {
    height: 48px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    font-size: 19px;
    font-weight: 700;
    color: #4f4039;
  }

  .settings {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #9e8e86;
    background: rgba(255, 255, 255, 0.38);
  }

  .content {
    padding: 18px 18px 0;
  }

  .partner-card {
    height: 342px;
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    background:
      radial-gradient(circle at 22% 12%, rgba(255, 255, 255, 0.46), transparent 28%),
      radial-gradient(circle at 82% 92%, rgba(255, 239, 213, 0.42), transparent 31%),
      linear-gradient(135deg, #ffb7a5 0%, #ffc4b5 45%, #ffd6bd 100%);
    border: 1px solid rgba(255, 255, 255, 0.46);
    box-shadow: 0 16px 36px rgba(255, 180, 162, 0.24);
  }

  .partner-card::after {
    content: "";
    position: absolute;
    inset: auto 24px -62px 24px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.16);
    filter: blur(2px);
  }

  .mood {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 66px;
    background: rgba(255, 255, 255, 0.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.38);
    transform: translateY(-4px);
  }

  .feeling {
    font-size: 30px;
    font-weight: 800;
    text-shadow: 0 2px 12px rgba(80, 42, 30, 0.18);
  }

  .doing {
    font-size: 16px;
    font-weight: 600;
    opacity: 0.92;
  }

  .soft-flow {
    margin: -8px 2px 0;
    padding: 18px 12px 16px;
    border-radius: 0 0 24px 24px;
    background: linear-gradient(180deg, rgba(255, 248, 244, 0.52), rgba(255, 250, 246, 0));
  }

  .notice {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px 14px;
    border-radius: 18px;
    background: rgba(255, 241, 237, 0.72);
    color: #5a4a42;
    font-size: 14px;
    font-weight: 650;
  }

  .status-row {
    margin-top: 10px;
    min-height: 58px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 18px;
    background: rgba(255, 250, 240, 0.68);
  }

  .mini-emoji {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.68);
    font-size: 25px;
  }

  .status-copy {
    flex: 1;
    min-width: 0;
  }

  .label {
    font-size: 12px;
    color: #aa9890;
    margin-bottom: 2px;
  }

  .value {
    font-size: 15px;
    font-weight: 650;
    color: #5a4a42;
  }

  .chevron {
    color: #b5a49c;
    font-size: 22px;
    padding-right: 2px;
  }

  .quick-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }

  .reply {
    height: 42px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #66534b;
    background: rgba(255, 255, 255, 0.64);
    box-shadow: inset 0 0 0 1px rgba(255, 180, 162, 0.18);
  }

  .reply:nth-child(1) { background: rgba(255, 239, 235, 0.76); }
  .reply:nth-child(2) { background: rgba(255, 246, 225, 0.82); }
  .reply:nth-child(3) { background: rgba(239, 248, 242, 0.78); }
  .reply:nth-child(4) { background: rgba(244, 241, 255, 0.78); }

  .publish {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 24px;
    height: 56px;
    border: 0;
    border-radius: 999px;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    background: #ffb4a2;
    box-shadow: 0 14px 26px rgba(255, 180, 162, 0.25);
  }

  .caption {
    position: fixed;
    left: 24px;
    bottom: 22px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 13px;
  }
</style>
</head>
<body>
  <main class="phone" aria-label="StandBy Us 首页融合感预览">
    <div class="status-bar">
      <span>9:41</span>
      <span>5G 100%</span>
    </div>

    <header class="header">
      <div class="brand">StandBy Us</div>
      <div class="settings">⚙</div>
    </header>

    <section class="content">
      <div class="partner-card">
        <div class="mood">😡</div>
        <div class="feeling">生气</div>
        <div class="doing">加班中</div>
      </div>

      <div class="soft-flow">
        <div class="notice">小周说：我也想你</div>

        <div class="status-row">
          <div class="mini-emoji">🥱</div>
          <div class="status-copy">
            <div class="label">我的状态</div>
            <div class="value">有点累，想早点休息</div>
          </div>
          <div class="chevron">›</div>
        </div>

        <div class="quick-grid">
          <button class="reply">抱抱一下</button>
          <button class="reply">我也想你</button>
          <button class="reply">辛苦啦</button>
          <button class="reply">现在怎么样</button>
        </div>
      </div>
    </section>

    <button class="publish">发布状态</button>
  </main>
  <div class="caption">预览方向：降低边框和阴影，让下方内容变成连续互动流</div>
</body>
</html>
