<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生日开屏礼物盒动效方案</title>
  <style>
    :root {
      --phone-w: 360px;
      --phone-h: 740px;
      --ink: #321b1d;
      --cream: #fff7da;
      --pink: #ff7fa4;
      --coral: #ff8b63;
      --gold: #ffd166;
      --blue: #84c6f4;
      --mint: #9de3c7;
      --shadow: 0 28px 80px rgba(46, 25, 35, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
      gap: 36px;
      align-items: center;
      padding: 34px;
      color: var(--ink);
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(255, 209, 102, .32), transparent 28%),
        radial-gradient(circle at 86% 22%, rgba(132, 198, 244, .34), transparent 25%),
        linear-gradient(135deg, #fff5e1, #ffe7ef 48%, #e7f5ff);
    }

    .panel {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      max-width: 620px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .intro {
      margin: 0;
      max-width: 520px;
      color: rgba(50, 27, 29, .72);
      font-size: 16px;
      line-height: 1.72;
    }

    .choices {
      display: grid;
      gap: 10px;
      max-width: 560px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      text-align: left;
      color: var(--ink);
      background: rgba(255, 255, 255, .66);
      box-shadow: inset 0 0 0 1px rgba(50, 27, 29, .08);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .9);
      outline: none;
      box-shadow: inset 0 0 0 2px rgba(255, 139, 99, .4), 0 10px 28px rgba(50, 27, 29, .12);
    }

    button[aria-pressed="true"] {
      background: #fff;
      box-shadow: inset 0 0 0 2px rgba(255, 126, 164, .58), 0 14px 34px rgba(50, 27, 29, .13);
    }

    .choice-title {
      display: block;
      font-weight: 800;
      font-size: 15px;
    }

    .choice-copy {
      display: block;
      margin-top: 4px;
      color: rgba(50, 27, 29, .62);
      font-size: 13px;
      line-height: 1.45;
    }

    .phone-wrap {
      justify-self: center;
      width: var(--phone-w);
      height: var(--phone-h);
      border: 8px solid #111;
      border-radius: 38px;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow);
      position: relative;
    }

    .status {
      height: 44px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      background: #fff9f8;
      color: rgba(50, 27, 29, .72);
    }

    .camera {
      position: absolute;
      left: 50%;
      top: 6px;
      width: 34px;
      height: 24px;
      transform: translateX(-50%);
      border-radius: 0 0 18px 18px;
      background: #111;
      z-index: 20;
    }

    .screen {
      position: relative;
      height: calc(100% - 44px);
      overflow: hidden;
      background: linear-gradient(180deg, #ff7fa4 0%, #ffae66 38%, #9bcef2 100%);
    }

    .option {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .option.active {
      opacity: 1;
      pointer-events: auto;
    }

    .image-card {
      position: absolute;
      left: 30px;
      right: 30px;
      top: 180px;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(72, 42, 46, .32);
      transform-origin: 50% 100%;
      background: #fff7da;
      z-index: 6;
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-crown {
      position: absolute;
      left: 50%;
      top: 82px;
      width: 150px;
      height: 74px;
      transform: translateX(-50%) rotate(-4deg);
      z-index: 8;
      filter:
        drop-shadow(0 8px 12px rgba(92, 50, 16, .22))
        drop-shadow(0 0 10px rgba(255, 229, 122, .5));
      pointer-events: none;
    }

    .image-crown::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: 32px;
      background:
        linear-gradient(90deg, transparent 0 10%, rgba(255,255,255,.42) 10% 15%, transparent 15% 100%),
        linear-gradient(135deg, #ffb72f, #ffe97d 54%, #ff9f2e);
      clip-path: polygon(0 100%, 0 46%, 18% 72%, 32% 0, 50% 66%, 68% 0, 82% 72%, 100% 46%, 100% 100%);
      border-radius: 0 0 10px 10px;
    }

    .image-crown::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -4px;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff3a3, #ffbb3e);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.58);
    }

    .crown-gem {
      position: absolute;
      bottom: 7px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #ff6f9f;
      box-shadow: 0 0 8px rgba(255, 111, 159, .72);
      z-index: 1;
    }

    .crown-gem:nth-child(1) { left: 34px; background: #7dd7ff; box-shadow: 0 0 8px rgba(125, 215, 255, .72); }
    .crown-gem:nth-child(2) { left: 54px; width: 10px; height: 10px; background: #ff6f9f; }
    .crown-gem:nth-child(3) { right: 34px; background: #b6ff9c; box-shadow: 0 0 8px rgba(182, 255, 156, .72); }

    .caption {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 84px;
      text-align: center;
      color: #fff;
      text-shadow: 0 3px 14px rgba(59, 28, 36, .36);
      z-index: 10;
    }

    .caption strong {
      display: block;
      font-size: 28px;
      line-height: 1.2;
    }

    .caption strong .line {
      display: block;
    }

    .caption span {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255, 255, 255, .86);
    }

    .gift {
      position: absolute;
      left: 50%;
      bottom: 54px;
      width: 150px;
      height: 106px;
      transform: translateX(-50%);
      z-index: 9;
    }

    .gift::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -10px;
      height: 18px;
      border-radius: 999px;
      background: rgba(85, 39, 45, .22);
      filter: blur(7px);
    }

    .box-base,
    .box-lid {
      position: absolute;
      left: 0;
      width: 100%;
      border-radius: 10px;
      background:
        linear-gradient(90deg, transparent 42%, #ffe07a 42% 58%, transparent 58%),
        radial-gradient(circle at 18% 24%, rgba(255, 255, 255, .42) 0 5px, transparent 6px),
        radial-gradient(circle at 82% 64%, rgba(255, 255, 255, .28) 0 4px, transparent 5px),
        linear-gradient(135deg, #ff5272, #ff8a53 56%, #ffb35f);
      box-shadow:
        inset 0 2px 0 rgba(255, 255, 255, .38),
        inset 0 -8px 16px rgba(151, 49, 64, .18),
        0 16px 34px rgba(103, 42, 50, .26);
      overflow: hidden;
    }

    .box-base {
      bottom: 0;
      height: 76px;
      border: 2px solid rgba(255, 246, 199, .7);
    }

    .box-lid {
      top: 2px;
      left: -8px;
      width: calc(100% + 16px);
      height: 36px;
      transform-origin: 12% 100%;
      border: 2px solid rgba(255, 246, 199, .82);
      background:
        linear-gradient(90deg, transparent 42%, #ffe07a 42% 58%, transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, .38), transparent 44%),
        linear-gradient(135deg, #ff6f89, #ff9b5f 62%, #ffc06d);
    }

    .box-base::before,
    .box-lid::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, transparent 0 36%, rgba(255, 255, 255, .26) 37% 42%, transparent 43% 100%);
      pointer-events: none;
    }

    .box-base::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 14px;
      background: rgba(91, 32, 42, .1);
      pointer-events: none;
    }

    .ribbon-bow {
      position: absolute;
      left: 50%;
      top: -30px;
      width: 88px;
      height: 52px;
      transform: translateX(-50%);
      z-index: 2;
    }

    .ribbon-bow::before,
    .ribbon-bow::after {
      content: "";
      position: absolute;
      top: 9px;
      width: 40px;
      height: 34px;
      border: 9px solid #ffe36f;
      border-radius: 60% 46% 60% 46%;
      background: rgba(255, 255, 255, .18);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.42), 0 5px 10px rgba(103,42,50,.16);
    }

    .ribbon-bow::before { left: 0; transform: rotate(-18deg); }
    .ribbon-bow::after { right: 0; transform: rotate(18deg) scaleX(-1); }

    .star,
    .confetti,
    .ribbon,
    .falling-star,
    .floating-heart {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .star {
      width: 8px;
      height: 8px;
      background: #fff5a8;
      clip-path: polygon(50% 0, 62% 35%, 100% 50%, 62% 65%, 50% 100%, 38% 65%, 0 50%, 38% 35%);
      filter: drop-shadow(0 2px 4px rgba(122, 70, 0, .16));
    }

    .confetti {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--gold);
    }

    .ribbon {
      width: 54px;
      height: 14px;
      border: 3px solid rgba(255, 245, 168, .9);
      border-left: 0;
      border-bottom: 0;
      border-radius: 50%;
      filter: drop-shadow(0 3px 5px rgba(122, 70, 0, .18));
    }

    .falling-star {
      width: 18px;
      height: 18px;
      top: -28px;
      background: var(--star-color, #fff7a8);
      clip-path: polygon(50% 0, 62% 35%, 100% 50%, 62% 65%, 50% 100%, 38% 65%, 0 50%, 38% 35%);
      filter:
        drop-shadow(0 3px 6px rgba(122, 70, 0, .22))
        drop-shadow(0 0 10px var(--star-glow, rgba(255, 247, 168, .72)));
    }

    .floating-heart {
      width: 18px;
      height: 18px;
      top: -34px;
      transform: rotate(-45deg);
      background: var(--heart-color, #ff78a8);
      filter:
        drop-shadow(0 3px 7px rgba(120, 34, 80, .22))
        drop-shadow(0 0 10px rgba(255, 152, 190, .55));
    }

    .floating-heart::before,
    .floating-heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: inherit;
    }

    .floating-heart::before {
      top: -9px;
      left: 0;
    }

    .floating-heart::after {
      top: 0;
      left: 9px;
    }

    .option[data-mode="pop"] .image-card {
      animation: popImage 4.2s cubic-bezier(.22, 1.2, .28, 1) infinite;
    }

    .option[data-mode="pop"] .box-lid {
      animation: lidFlip 4.2s ease-in-out infinite;
    }

    .option[data-mode="pop"] .gift {
      animation: boxBounce 4.2s ease-in-out infinite;
    }

    .option[data-mode="pop"] .star,
    .option[data-mode="pop"] .confetti {
      animation: burst 4.2s ease-out infinite;
    }

    .option[data-mode="ribbon"] .image-card {
      left: 20px;
      right: 20px;
      top: 148px;
      border: 8px solid rgba(255, 247, 218, .9);
      border-radius: 12px;
      animation: ribbonRise 4.6s cubic-bezier(.18, 1.05, .22, 1) infinite;
    }

    .option[data-mode="ribbon"] .image-crown {
      animation: crownDrop 4.6s cubic-bezier(.18, 1.05, .22, 1) infinite;
    }

    .option[data-mode="ribbon"] .box-lid {
      animation: slideLid 4.6s ease-in-out infinite;
    }

    .option[data-mode="ribbon"] .caption {
      display: none;
    }

    .option[data-mode="ribbon"] .caption strong {
      display: block;
      width: 100%;
      padding: 0;
      font-family: "Microsoft YaHei", "STXingkai", "KaiTi", system-ui, sans-serif;
      font-size: 108px;
      line-height: .78;
      font-weight: 900;
      color: transparent;
      background: linear-gradient(180deg, #e9fbff 0%, #74d8ff 34%, #2387ff 68%, #1550d9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 1.3px rgba(18, 55, 133, .96);
      text-shadow:
        0 2px 0 rgba(255, 255, 255, .68),
        0 5px 12px rgba(25, 68, 148, .36),
        0 0 18px rgba(157, 226, 255, .76);
      transform: rotate(-2deg);
    }

    .option[data-mode="ribbon"] .caption strong .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      white-space: nowrap;
      transform-origin: center;
    }

    .option[data-mode="ribbon"] .caption strong .line span {
      display: inline-block;
      color: transparent;
      background: linear-gradient(180deg, #e9fbff 0%, #74d8ff 34%, #2387ff 68%, #1550d9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 1.3px rgba(18, 55, 133, .96);
      text-shadow:
        0 2px 0 rgba(255, 255, 255, .68),
        0 5px 12px rgba(25, 68, 148, .36),
        0 0 18px rgba(157, 226, 255, .76);
    }

    .option[data-mode="ribbon"] .caption strong .line:first-child {
      transform: none;
    }

    .option[data-mode="ribbon"] .caption strong .line + .line {
      margin-top: 8px;
      transform: rotate(2deg);
    }

    .option[data-mode="ribbon"] .ribbon {
      animation: ribbonTrail 5.2s ease-out infinite;
    }

    .option[data-mode="ribbon"] .falling-star {
      animation: starFall 5.8s linear infinite;
    }

    .option[data-mode="ribbon"] .floating-heart {
      animation: heartFloat 6.6s ease-in-out infinite;
    }

    .option[data-mode="ribbon"] .star,
    .option[data-mode="ribbon"] .confetti {
      animation: driftFall 4.6s ease-in-out infinite;
    }

    .option[data-mode="stage"] .image-card {
      top: 138px;
      left: 24px;
      right: 24px;
      border: 8px solid rgba(255, 247, 218, .9);
      animation: stageReveal 4.8s cubic-bezier(.2, 1, .22, 1) infinite;
    }

    .option[data-mode="stage"] .gift {
      bottom: 34px;
      transform: translateX(-50%) scale(.9);
      animation: stagePulse 4.8s ease-in-out infinite;
    }

    .option[data-mode="stage"] .box-lid {
      animation: stageLid 4.8s ease-in-out infinite;
    }

    .option[data-mode="stage"]::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 80px;
      width: 260px;
      height: 470px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(255,255,255,.46), transparent 62%);
      opacity: 0;
      animation: spotlight 4.8s ease-in-out infinite;
      z-index: 1;
    }

    .option[data-mode="stage"] .star,
    .option[data-mode="stage"] .confetti {
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .top-sparkles .confetti:nth-child(1) { left: 78px; top: 40px; background: #ff805f; animation-delay: .1s; }
    .top-sparkles .confetti:nth-child(2) { left: 138px; top: 72px; background: #ff9cd0; animation-delay: .3s; }
    .top-sparkles .confetti:nth-child(3) { right: 58px; top: 74px; background: #78d2ff; animation-delay: .5s; }
    .top-sparkles .confetti:nth-child(4) { right: 100px; top: 164px; background: #fff2a2; animation-delay: .7s; }
    .top-sparkles .confetti:nth-child(5) { left: 184px; top: 126px; background: #78d2ff; animation-delay: .2s; }

    .top-sparkles .star:nth-child(8) { right: 42px; top: 200px; animation-delay: .74s; }

    .burst-layer .star:nth-child(2) { left: 244px; bottom: 206px; animation-delay: .18s; }

    .falling-stars .falling-star:nth-child(8) { left: 212px; animation-delay: .92s; animation-duration: 6.6s; transform: scale(.82); --star-color: #ff9fd0; --star-glow: rgba(255, 159, 208, .7); }
    .falling-stars .falling-star:nth-child(9) { left: 240px; animation-delay: 1.8s; animation-duration: 5.7s; transform: scale(.92); --star-color: #82dfff; --star-glow: rgba(130, 223, 255, .72); }
    .falling-stars .falling-star:nth-child(10) { left: 268px; animation-delay: 2.04s; animation-duration: 6s; transform: scale(.76); --star-color: #b8ffce; --star-glow: rgba(184, 255, 206, .66); }

  <aside class="panel">
    <h1>生日礼物盒开屏特效</h1>
    <p class="intro">下面是 3 个方向。点选会在手机预览里切换并重播动效，重点比较“蹦出来”的力度、丝带存在感、图片是否抢眼。</p>
    <div class="choices" role="group" aria-label="动效方案选择">
      <button type="button" aria-pressed="false" data-target="option-pop">
        <span class="choice-title">方案 A：礼物盒弹跳 Pop</span>
        <span class="choice-copy">最直接可爱。盒盖弹开，图片从盒子里弹出，星星和小彩片瞬间爆开。适合生日当天一打开就有惊喜。</span>
      </button>
      <button type="button" aria-pressed="true" data-target="option-ribbon">
        <span class="choice-title">方案 B：丝带旋出 Reveal</span>
        <span class="choice-copy">更浪漫。先出现几条弧形丝带，图片跟着从礼物盒里展开，动效更柔软，和情侣 App 气质更贴。</span>
      </button>
      <button type="button" aria-pressed="false" data-target="option-stage">
        <span class="choice-title">方案 C：舞台聚光 Reveal</span>
        <span class="choice-copy">仪式感最强。礼物盒像舞台机关，图片带浅色边框升起，背景有光晕，适合更“隆重”的生日开屏。</span>
      </button>
    </div>
  </aside>

  <script>
    const buttons = [...document.querySelectorAll("button[data-target]")];
    const options = [...document.querySelectorAll(".option")];

    function replay(el) {
      el.getAnimations({ subtree: true }).forEach(animation => {
        animation.cancel();
        animation.play();
      });
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        buttons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        options.forEach(option => option.classList.toggle("active", option.id === button.dataset.target));
        replay(document.getElementById(button.dataset.target));
      });
    });
  </script>
